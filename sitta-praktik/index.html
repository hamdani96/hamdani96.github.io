<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.png" />
    <title>SITTA UT</title>

    <!-- Google Fonts Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">

    <!-- Fontawesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Izitoast -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/izitoast/1.4.0/css/iziToast.min.css"
        integrity="sha512-O03ntXoVqaGUTAeAmvQ2YSzkCvclZEcPQu1eqloPaHfJ5RuNGiS4l+3duaidD801P50J28EHyonCV06CUlTSag=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-bg">

    <div class="auth">
        <div class="card">
            <div class="card-title">
                <img src="assets/logo.png" style="width: 70px; align-items: center;" alt="">
                <h2>Login</h2>
                <small>Hai, selamat di sistem pemesanan dan distribusi bahan ajar UT</small>
            </div>

            <div class="card-body">
                <form action="" id="form-login">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Masukkan email kamu">
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Masukkan password kamu">
                    </div>
                    <small><a href="#lupa-password" style="color: black; text-decoration: none;">Lupa
                            Password?</a></small>

                    <button type="submit" class="btn btn-primary btn-block align-center"
                        style="margin-top: 10px;">Login</button>
                </form>
            </div>

            <div class="card-footer">
                <small>Belum punya akun? <a href="#register"
                        style="color: black; text-decoration: none; font-weight: bold;">Daftar</a></small>
            </div>
        </div>
    </div>

    <!-- popup lupa password -->
    <div id="lupa-password" class="overlay">
        <div class="popup">
            <a class="close" href="#"><i class="fa-solid fa-xmark"></i></a>
            <div class="header">
                <h2>Lupa Password</h2>
                <small>Masukan email kamu, kami akan mengirimkan link reset password ke email yang kamu masukan.</small>
            </div>
            <div class="content">
                <form action="">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Masukkan email kamu">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block align-center">Kirim</button>
                </form>
            </div>
        </div>
    </div>

     <!-- popup register -->
    <div id="register" class="overlay">
        <div class="popup">
            <a class="close" href="#"><i class="fa-solid fa-xmark"></i></a>
            <div class="header">
                <img src="assets/logo.png" style="width: 70px;" alt="">
                <h2>Register</h2>
                <small>Daftarkan diri kamu.</small>
            </div>
            <div class="content">
                <form action="">
                    <div class="input-group">
                        <label for="nama">Nama</label>
                        <input type="text" id="nama" placeholder="Masukkan nama kamu">
                    </div>

                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Masukkan email kamu">
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Masukkan password kamu">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block align-center">Register</button>
                </form>
            </div>
        </div>
    </div>

    <!-- izitoast -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/izitoast/1.4.0/js/iziToast.min.js"
        integrity="sha512-Zq9o+E00xhhR/7vJ49mxFNJ0KQw1E1TMWkPTxrWcnpfEFDEXgUiwJHIKit93EW/XxE31HSI5GEOW06G6BF1AtA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="js/script.js"></script>
</body>

</html>

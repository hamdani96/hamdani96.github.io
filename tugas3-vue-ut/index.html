    <!-- Google Fonts Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Fontawesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"

<body>

    <div id="app">

        <div class="container">
            <nav class="text-right">
                <button @click="tab='stok'" class="btn btn-primary">Stok Bahan Ajar</button>

            </nav>

            <section v-show="tab==='stok'">
                <do-stock></do-stock>
            </section>
            <section v-show="tab==='track'">
                <do-tracking></do-tracking>
            </section>
        </div>

    </div>

    <script src="js/services/api.js"></script>
    <script src="js/components/do-stock.js"></script>
    <script src="js/components/do-tracking.js"></script>
    <script src="js/components/progress-modal.js"></script>
    <script src="js/app.js"></script>
